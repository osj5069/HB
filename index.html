<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>믿음의 가정 생활비</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;--ink:#162b37;--muted:#71808b;--line:#e1e9eb;--bg:#f4f8f7;--card:#fff;--teal:#0f766e;--pale:#e6f5f1;--bad:#ce4747;--warn:#bb761e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 system-ui,-apple-system,'Malgun Gothic',sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #94d9c9;outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:24px 18px 80px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:19px}.logo{font-size:24px;font-weight:850;letter-spacing:-.7px}.sub{font-size:12px;color:var(--muted)}.head-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:9px 13px;font-weight:700}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.ghost{border-color:transparent;background:transparent}.btn.sm{font-size:12px;padding:6px 10px}.card{background:var(--card);border:1px solid var(--line);box-shadow:0 2px 10px #123b3508;border-radius:19px;padding:20px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:15px}.month{font-weight:850;font-size:21px;letter-spacing:-.5px}.tag{background:var(--pale);color:var(--teal);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.budget-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.big{font-size:clamp(27px,5vw,44px);font-weight:900;letter-spacing:-1.5px;line-height:1.25;margin:8px 0 13px}.big.negative{color:var(--bad)}.progress{height:13px;background:#e4edeb;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:var(--teal);transition:width .2s}.progress>div.warn{background:var(--warn)}.progress>div.bad{background:var(--bad)}.nums{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:13px 0 19px}.stat strong{font-size:20px;display:block;margin-top:5px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}.section-head h2{font-size:18px;margin:0}.hint{color:var(--muted);font-size:12px}.ledger{overflow:hidden;padding:0}.ledger-header,.day{display:grid;grid-template-columns:65px minmax(0,1fr) minmax(0,1fr)}.ledger-header{background:#eaf3f1;font-weight:800;text-align:center}.ledger-header>*{padding:14px 8px;border-right:1px solid var(--line)}.ledger-header>:last-child{border:0}.day{border-top:1px solid var(--line);min-height:64px}.day.today{background:#f0fbf7}.day-date{display:flex;align-items:flex-start;justify-content:center;padding-top:14px;gap:3px;border-right:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:700}.day-date b{color:var(--ink)}.day-cell{padding:8px 9px;border-right:1px solid var(--line);min-width:0}.day-cell:last-child{border:0}.mini-add{color:var(--teal);background:transparent;border:1px dashed #9fd5c8;border-radius:8px;padding:3px 8px;font-size:11px;margin-bottom:4px}.entry{border:1px solid #e5ebec;border-radius:10px;padding:7px 8px;display:flex;justify-content:space-between;gap:5px;margin:5px 0;background:#fff;cursor:pointer;text-align:left;width:100%;align-items:center}.entry .what{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.entry strong{font-size:13px;white-space:nowrap}.entry:hover{border-color:#82c3b5}.categories{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.category-box{background:#f7faf9;border:1px solid var(--line);border-radius:13px;padding:11px 9px}.category-box .value{font-size:16px;font-weight:800;margin-top:3px}.message{padding:12px 15px;border-radius:13px;margin:0 0 15px;background:#fff9e8;border:1px solid #f0dea6;font-size:13px}.message.error{background:#fff0f0;border-color:#f5cccc;color:#a92f2f}.message.success{background:#eaf8f2;border-color:#badfd4;color:#116c59}.footnote{color:var(--muted);font-size:12px;margin:20px 0;text-align:center}.modal-shade{position:fixed;inset:0;background:#122e367a;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:#fff;border-radius:21px;padding:22px;width:min(100%,460px);max-height:93vh;overflow:auto;box-shadow:0 12px 42px #10262b42}.modal h2{margin:0 0 15px;font-size:22px}.field{margin-bottom:12px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.field input,.field select{border:1px solid #cbd9dc;border-radius:11px;width:100%;padding:12px;background:white;color:var(--ink)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}.help{font-size:12px;color:var(--muted)}.hidden{display:none!important}.divider{border:0;border-top:1px solid var(--line);margin:17px 0}.setup-code{font-family:monospace;color:var(--teal);word-break:break-all}.details summary{cursor:pointer;font-weight:800}.right{text-align:right}.sync{font-size:12px;color:var(--muted);margin-bottom:14px}.spacer{flex:1}.pill{display:inline-block;border-radius:99px;background:#edf4f4;padding:4px 10px;font-size:11px;font-weight:750}.over{color:var(--bad)}.save-state{font-size:13px;font-weight:750;color:var(--muted);min-height:19px;margin:-4px 0 10px}.save-state.saving{color:#a56b00}.save-state.saved{color:#116c59}.save-state.failed{color:var(--bad)}
@media(max-width:670px){.wrap{padding:14px 10px 65px}.logo{font-size:20px}.head{align-items:flex-start}.head-actions .btn{padding:7px 8px;font-size:11px}.card{padding:15px}.stats{gap:6px}.stat{padding:12px 8px}.stat strong{font-size:16px}.ledger-header,.day{grid-template-columns:43px minmax(0,1fr) minmax(0,1fr)}.ledger-header>*{padding:11px 3px;font-size:13px}.day-date{padding-top:15px;font-size:11px}.day-cell{padding:6px 4px}.entry{padding:6px 5px;display:block}.entry strong{font-size:12px}.entry .what{font-size:10px}.mini-add{width:100%;padding:3px}.categories{grid-template-columns:repeat(2,minmax(0,1fr))}.month{font-size:19px}}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main class="wrap">
<header class="head"><div><div class="logo">🏡 믿음의 가정 생활비</div></div><div class="head-actions"><button class="btn sm" id="setupBtn">⚙ 연결</button><button class="btn sm" id="refreshBtn">↻ 새로고침</button><button class="btn sm" id="exportBtn">↓ 월별 CSV</button></div></header>
<div id="notice" class="message hidden" role="status" aria-live="polite"></div><div id="saveState" class="save-state" role="status" aria-live="polite"></div>
<div class="toolbar"><button class="btn" id="prevMonth" aria-label="이전 달">‹</button><div class="right"><div class="month" id="monthLabel"></div><div class="sync" id="syncState">구글 연결 확인 중</div></div><button class="btn" id="nextMonth" aria-label="다음 달">›</button></div>
<section class="card"><div class="budget-top"><div><div class="sub">월 생활비 한도</div><strong id="budgetValue"></strong></div><button class="btn sm" id="budgetBtn">한도 설정</button></div><hr class="divider"><div class="sub">이번 달 남은 생활비</div><div class="big" id="remainingValue"></div><div class="progress"><div id="progressFill"></div></div><div class="nums"><span id="remainingPct"></span><span id="usedValue"></span></div></section>
<div class="stats"><section class="card stat"><div class="sub">남편 사용</div><strong id="husbandTotal">0원</strong></section><section class="card stat"><div class="sub">아내 사용</div><strong id="wifeTotal">0원</strong></section><section class="card stat"><div class="sub">총 사용</div><strong id="allTotal">0원</strong></section></div>
<div class="section-head"><h2>날짜별 사용내역</h2><button class="btn sm" id="todayBtn">↓ 오늘로 이동</button></div>
<section class="card ledger"><div class="ledger-header"><div>날짜</div><div>남편</div><div>아내</div></div><div id="dayRows"></div></section>
<div class="section-head" style="margin-top:25px"><h2>카테고리별 사용</h2><span class="hint">이번 달</span></div><div class="categories" id="categoryRows"></div>
<p class="footnote">저장소: Google Sheets · 공유 주기: 2분 + 수동 새로고침 · 모든 금액은 원 단위</p>
</main>
<div id="modalBackdrop" class="modal-shade hidden" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalActions" class="actions"></div></div></div>
<script>
'use strict';
const CATEGORIES=['쇼핑','외식','배달','장보기','생활용품'];
const METHODS=['신용카드','계좌이체','현금'];
const DATA_TAB='Ledger';
const SCOPE='https://www.googleapis.com/auth/spreadsheets';
const $=id=>document.getElementById(id);
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const stamp=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const monthNow=()=>stamp().slice(0,7);
const uid=()=>crypto.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const safe=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const demoKey='family-budget-demo-v1';
const setupKey='family-budget-config-v1';
const defaults={clientId:'',sheetId:''};
let config={...defaults,...JSON.parse(localStorage.getItem(setupKey)||'{}')};
let currentMonth=monthNow();
let events=[];
let accessToken='';let tokenClient=null;let lastSync=null;let busy=false;let fetchVersion=0;
let demoMode=!config.clientId||!config.sheetId;
const initialDemo=[
  {id:'demo-budget',type:'budget',target:'',date:monthNow()+'-01',who:'',amount:1000000,details:{}},
  {id:'demo-1',type:'create',target:'demo-exp-1',date:monthNow()+'-02',who:'남편',amount:35000,details:{category:'장보기',payment:'신용카드',memo:'마트'}},
  {id:'demo-2',type:'create',target:'demo-exp-2',date:monthNow()+'-03',who:'아내',amount:18000,details:{category:'배달',payment:'계좌이체',memo:'저녁'}}
];
function demoLoad(){try{return JSON.parse(localStorage.getItem(demoKey))||initialDemo}catch{return initialDemo}}
function setNotice(t='',kind=''){const el=$('notice');el.textContent=t;el.className='message '+kind;el.classList.toggle('hidden',!t)}
function getExpenses(){const data=new Map();for(const ev of events){if(ev.type==='create'||ev.type==='edit')data.set(ev.target,{...ev,recordId:ev.target});if(ev.type==='delete')data.delete(ev.target)}return [...data.values()]}
function monthlyExpenses(){return getExpenses().filter(e=>e.date.startsWith(currentMonth)).sort((a,b)=>a.date.localeCompare(b.date))}
function budgetOf(month){let amount=0,source='기본값 없음',latest='',latestIndex=-1;events.forEach((e,index)=>{const ym=String(e.date||'').slice(0,7);if(e.type==='budget'&&ym<=month&&(ym>latest||(ym===latest&&index>latestIndex))){amount=Number(e.amount)||0;latest=ym;latestIndex=index;source=ym===month?'이번 달 설정':'이전 달 한도 적용'}});return {amount,source}}
function setSaveState(message='',state=''){const el=$('saveState');el.textContent=message;el.className='save-state '+state}
function appendLocal(e){events.push(e);localStorage.setItem(demoKey,JSON.stringify(events));lastSync=new Date();render()}
async function api(path,method='GET',data){if(!accessToken)throw new Error('구글 로그인이 필요합니다. 연결 메뉴에서 로그인해 주세요.');const url='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(config.sheetId)+path;const resp=await fetch(url,{method,headers:{Authorization:'Bearer '+accessToken,...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined});if(!resp.ok){let msg='';try{const b=await resp.json();msg=b.error?.message||''}catch{}if(resp.status===401){accessToken='';throw new Error('구글 로그인이 만료되었습니다. 연결 메뉴에서 다시 로그인해 주세요.')}throw new Error(`Google Sheets 오류 ${resp.status}: ${msg||'시트 공유 권한과 API 설정을 확인하세요.'}`)}return resp.json()}
async function loadRemote(silent=false){
 if(demoMode||!accessToken)return false;
 const version=++fetchVersion;
 try{
  const path='/values/'+encodeURIComponent("'"+DATA_TAB+"'!A2:H")+'?valueRenderOption=UNFORMATTED_VALUE';
  const data=await api(path);
  if(version!==fetchVersion)return false; // 오래된 응답이 새 데이터 위에 덮어쓰지 않게 함
  const parsed=[];
  for(const row of data.values||[]){
   if(!row[0])continue;
   try{parsed.push({id:String(row[0]),at:String(row[1]||''),type:String(row[2]),target:String(row[3]||''),date:String(row[4]||''),who:String(row[5]||''),amount:Number(row[6]||0),details:JSON.parse(row[7]||'{}')})}
   catch(e){console.warn('건너뛴 행',e)}
  }
  events=parsed;lastSync=new Date();render();
  if(!silent)setNotice('공유 가계부의 최신 기록을 불러왔습니다.','success');
  return true;
 }catch(err){
  if(!silent)setNotice(err.message,'error');
  $('syncState').textContent='동기화 실패 · 연결 확인 필요';console.error(err);
  return false;
 }
}
async function appendEvent(event){
 if(busy)throw new Error('이전 저장 작업이 진행 중입니다.');
 busy=true;setSaveState('● 저장 중…','saving');setNotice();
 let appended=false;
 try{
  if(demoMode){appendLocal(event);setSaveState('✓ 이 기기에 저장 완료 (체험 모드)','saved');return}
  const row=[event.id,new Date().toISOString(),event.type,event.target,event.date,event.who,event.amount,JSON.stringify(event.details||{})];
  // 늦게 도착하는 이전 조회 결과를 무효화
  ++fetchVersion;
  await api('/values/'+encodeURIComponent("'"+DATA_TAB+"'!A:H")+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS','POST',{values:[row]});
  appended=true;
  // 서버 저장 성공 직후에는 화면도 새 값을 반영해 100만원 등 이전 값이 보이지 않게 함
  events.push({...event,at:row[1]});lastSync=new Date();render();
  setSaveState('✓ 구글 시트에 저장 완료','saved');
  // 조회 실패 시에도 이미 성공한 저장은 유지, 새로고침 실패만 별도로 알림
  const loaded=await loadRemote(true);
  if(!loaded){setSaveState('✓ 저장 완료 · 최신 동기화 확인 필요','saved')}
 }catch(err){
  setSaveState(appended?'✓ 저장됨 · 화면 동기화 확인 필요':'✕ 저장 실패 · 다시 시도해 주세요',appended?'saved':'failed');
  setNotice(err.message,'error');throw err;
 }finally{busy=false}
}
function render(){const records=monthlyExpenses(),{amount:budget,source}=budgetOf(currentMonth),sum=records.reduce((s,x)=>s+x.amount,0),remain=budget-sum,pct=budget?remain/budget*100:0;const by=w=>records.filter(x=>x.who===w).reduce((s,x)=>s+x.amount,0);$('monthLabel').textContent=currentMonth.replace('-','년 ')+'월';$('budgetValue').textContent=won(budget);$('remainingValue').textContent=won(remain);$('remainingValue').classList.toggle('negative',remain<0);$('progressFill').style.width=Math.max(0,Math.min(100,pct))+'%';$('progressFill').className=pct<=10?'bad':pct<=20?'warn':'';$('remainingPct').textContent=budget?`${Math.round(pct*10)/10}% 남음 · ${source}`:'생활비 한도를 설정해 주세요';$('usedValue').textContent=`사용 ${won(sum)} / 한도 ${won(budget)}`;$('husbandTotal').textContent=won(by('남편'));$('wifeTotal').textContent=won(by('아내'));$('allTotal').textContent=won(sum);$('syncState').textContent=demoMode?'체험 모드 · 이 기기에만 저장':lastSync?'마지막 동기화: '+lastSync.toLocaleTimeString('ko-KR'):'구글 로그인 후 기록 표시';
 const [y,m]=currentMonth.split('-').map(Number);const last=new Date(y,m,0).getDate();const today=stamp();let html='';for(let day=1;day<=last;day++){const iso=`${currentMonth}-${String(day).padStart(2,'0')}`,week=['일','월','화','수','목','금','토'][new Date(y,m-1,day).getDay()];html+=`<div class="day ${iso===today?'today':''}" ${iso===today?'id="todayRow"':''}><div class="day-date"><b>${day}</b><span>${week}</span></div>`;for(const who of ['남편','아내']){html+=`<div class="day-cell"><button class="mini-add" data-action="add" data-date="${iso}" data-who="${who}">＋ 입력</button>`;for(const e of records.filter(x=>x.date===iso&&x.who===who)){html+=`<button class="entry" data-action="edit" data-id="${safe(e.recordId)}" title="수정하기"><span class="what">${safe(e.details.category||'기타')} · ${safe(e.details.memo||e.details.payment||'')}</span><strong>${won(e.amount)}</strong></button>`}html+='</div>'}html+='</div>'}$('dayRows').innerHTML=html;
 $('categoryRows').innerHTML=CATEGORIES.map(c=>{const n=records.filter(x=>x.details.category===c).reduce((s,x)=>s+x.amount,0);return `<div class="category-box"><div class="sub">${c}</div><div class="value">${won(n)}</div></div>`}).join('')}
function showModal(title,body,buttons){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML='';for(const b of buttons){const el=document.createElement('button');el.className='btn '+(b.primary?'primary':'')+(b.danger?' over':'');el.textContent=b.text;el.addEventListener('click',b.action);$('modalActions').append(el)}$('modalBackdrop').classList.remove('hidden')}
function closeModal(){$('modalBackdrop').classList.add('hidden')}
function opt(items,selected){return items.map(x=>`<option value="${safe(x)}" ${x===selected?'selected':''}>${safe(x)}</option>`).join('')}
function field(label,id,type,value='',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${safe(value)}" ${extra}></div>`}
function openExpense(date,who,existing=null){const e=existing;const body=field('사용 날짜','fDate','date',e?.date||date,'required')+`<div class="field"><label for="fWho">사용자</label><select id="fWho">${opt(['남편','아내'],e?.who||who)}</select></div>`+field('금액 (원)','fAmount','number',e?.amount||'','min="1" step="1" placeholder="예: 12000"')+`<div class="field"><label for="fCat">카테고리</label><select id="fCat">${opt(CATEGORIES,e?.details?.category||'장보기')}</select></div><div class="field"><label for="fPay">결제수단</label><select id="fPay">${opt(METHODS,e?.details?.payment||'신용카드')}</select></div>`+field('사용처 / 메모 (선택)','fMemo','text',e?.details?.memo||'','maxlength="80" placeholder="예: 마트, 점심"');const buttons=[{text:'닫기',action:closeModal}];if(e)buttons.push({text:'삭제',danger:true,action:()=>removeExpense(e)});buttons.push({text:e?'수정 저장':'추가하기',primary:true,action:async()=>{const date=$('fDate').value,who=$('fWho').value,amount=Number($('fAmount').value),cat=$('fCat').value,payment=$('fPay').value,memo=$('fMemo').value.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isInteger(amount)||amount<=0||amount>1000000000){alert('날짜와 1원 이상의 올바른 금액을 확인하세요.');return}try{await appendEvent({id:uid(),type:e?'edit':'create',target:e?.recordId||uid(),date,who,amount,details:{category:cat,payment,memo}});currentMonth=date.slice(0,7);render();closeModal()}catch{}}});showModal(e?'지출 수정':'지출 추가',body,buttons)}
async function removeExpense(e){if(!confirm('이 지출을 삭제할까요?'))return;try{await appendEvent({id:uid(),type:'delete',target:e.recordId,date:e.date,who:e.who,amount:0,details:{}});closeModal()}catch{}}
function openBudget(){const current=budgetOf(currentMonth).amount;showModal(currentMonth+' 생활비 한도',field('생활비 한도 (원)','newBudget','number',current,'min="1" step="1"')+'<p class="help">이 달의 한도를 변경하면 남은 생활비가 즉시 다시 계산됩니다. 다음 달은 별도 설정이 없으면 최근 한도를 이어받습니다.</p>',[{text:'닫기',action:closeModal},{text:'한도 저장',primary:true,action:async()=>{const a=Number($('newBudget').value);if(!Number.isInteger(a)||a<=0||a>10000000000){alert('한도는 1원 이상으로 입력해 주세요.');return}try{await appendEvent({id:uid(),type:'budget',target:'',date:currentMonth+'-01',who:'',amount:a,details:{}});closeModal()}catch{}}}])}
function connectGoogle(cid=config.clientId,sid=config.sheetId){
 if(!cid||!sid){openSetup();return}
 config={clientId:cid,sheetId:sid};localStorage.setItem(setupKey,JSON.stringify(config));
 if(!window.google?.accounts?.oauth2){setNotice('구글 로그인 기능을 불러오지 못했습니다. 잠시 후 다시 눌러 주세요.','error');return}
 setSaveState('구글 계정 연결 중…','saving');
 tokenClient=google.accounts.oauth2.initTokenClient({client_id:config.clientId,scope:SCOPE,callback:async response=>{
  if(response.error||!response.access_token){setSaveState('구글 로그인 실패 · 다시 시도해 주세요','failed');setNotice('구글 로그인 오류: '+(response.error||'토큰을 받지 못했습니다.'),'error');return}
  accessToken=response.access_token;demoMode=false;events=[];lastSync=null;closeModal();render();setSaveState('구글 시트 연결 중…','saving');
  const ok=await loadRemote();setSaveState(ok?'✓ 공동 저장소 연결 완료':'✕ 데이터 불러오기 실패',ok?'saved':'failed');
  updateConnectionButton();
 }});
 // 기존 승인 계정은 재동의 절차 없이 요청. 승인이나 로그인 화면이 필요할 수 있음.
 tokenClient.requestAccessToken({prompt:''});
}
function updateConnectionButton(){
 $('setupBtn').textContent=(!demoMode&&!accessToken&&config.clientId&&config.sheetId)?'↪ Google 재연결':'⚙ 연결';
}
function openSetup(){const html=`<p class="help">처음 한 번만 연결 정보를 입력하면 이후에는 상단 Google 재연결 버튼으로 다시 로그인할 수 있습니다.</p>${field('Google OAuth 클라이언트 ID','clientId','text',config.clientId,'placeholder="...apps.googleusercontent.com"')}${field('Google 스프레드시트 ID','sheetId','text',config.sheetId,'placeholder="시트 URL의 /d/ 다음 문자열"')}<p class="help">보안: 구글 비밀번호나 API 비밀키를 입력하지 않습니다. 접근 토큰은 브라우저 저장소에 장기간 저장하지 않습니다.</p><p class="help">공유 시트 탭 이름: <b class="setup-code">Ledger</b>, 1행: <span class="setup-code">event_id | created_at | kind | target_id | date | who | amount | details_json</span></p><p class="help" id="setupState">${accessToken?'현재 구글 연결됨':'구글 연결 전'}</p>`;showModal('공동 저장소 연결',html,[{text:'체험 모드',action:()=>{demoMode=true;events=demoLoad();accessToken='';lastSync=null;render();closeModal();updateConnectionButton();setNotice('체험 모드로 전환했습니다. 데이터는 이 브라우저에만 저장됩니다.')}},{text:'설정 저장',action:()=>{config={clientId:$('clientId').value.trim(),sheetId:$('sheetId').value.trim()};localStorage.setItem(setupKey,JSON.stringify(config));demoMode=!config.clientId||!config.sheetId;events=demoMode?demoLoad():[];lastSync=null;render();accessToken='';tokenClient=null;closeModal();updateConnectionButton();setNotice('설정이 저장되었습니다. 구글 재연결을 눌러 로그인하세요.')}},{text:'Google 로그인',primary:true,action:()=>connectGoogle($('clientId').value.trim(),$('sheetId').value.trim())}])}
function csvCell(v){const x=String(v??'');const safeValue=/^[=+@\-\t\r]/.test(x)?"'"+x:x;return '"'+safeValue.replace(/"/g,'""')+'"'}
function exportCSV(){const exp=monthlyExpenses();const rows=[['날짜','사용자','카테고리','결제수단','내용','금액'],...exp.map(e=>[e.date,e.who,e.details.category||'',e.details.payment||'',e.details.memo||'',e.amount])];const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');const link=document.createElement('a');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.href=url;link.download=`믿음의_가정_생활비_${currentMonth}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('prevMonth').onclick=()=>{let [y,m]=currentMonth.split('-').map(Number);currentMonth=m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`;render()};$('nextMonth').onclick=()=>{let [y,m]=currentMonth.split('-').map(Number);currentMonth=m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`;render()};$('todayBtn').onclick=()=>{currentMonth=monthNow();render();$('todayRow')?.scrollIntoView({behavior:'smooth',block:'center'})};$('budgetBtn').onclick=openBudget;$('setupBtn').onclick=()=>{if(!demoMode&&!accessToken&&config.clientId&&config.sheetId)connectGoogle();else openSetup()};$('exportBtn').onclick=exportCSV;$('refreshBtn').onclick=()=>demoMode?setNotice('체험 모드입니다. 두 사람의 기록을 공유하려면 구글 시트를 연결하세요.'):loadRemote();$('dayRows').onclick=e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;if(btn.dataset.action==='add')openExpense(btn.dataset.date,btn.dataset.who);else if(btn.dataset.action==='edit'){const item=getExpenses().find(x=>x.recordId===btn.dataset.id);if(item)openExpense(item.date,item.who,item)}};$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('focus',()=>{if(!demoMode&&accessToken&&lastSync&&Date.now()-lastSync.getTime()>120000)loadRemote(true)});setInterval(()=>{if(!demoMode&&accessToken&&!busy)loadRemote(true)},120000);
if(demoMode){events=demoLoad();render();setSaveState('체험 모드 · 공유하려면 연결을 설정하세요')}else{events=[];render();setSaveState('구글 재연결을 눌러 공동 기록을 불러오세요')}updateConnectionButton();
</script>
</body></html>
